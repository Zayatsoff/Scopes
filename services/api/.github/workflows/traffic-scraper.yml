# .github/workflows/traffic-scraper.yml
name: Traffic Alerts Scraper Workflow

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Dependencies
        run: |
          npm install
          npm install axios date-fns date-fns-tz

      - name: Run Traffic Alerts Scraper
        run: npx ts-node scripts/scrape-traffic.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
