name: RSS Scraper Workflow

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      firestore_env:
        description: "Firestore env to target"
        type: choice
        options: [dev, production]
        default: dev

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: vars.SCRAPERS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run RSS scraper
        run: yarn workspace api run scrape:news
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRESTORE_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.firestore_env || vars.FIRESTORE_ENV || 'dev' }}
